# 실행 설정. 청킹·검색 값은 코드가 아니라 여기서 바꾼다. (F2005, F2006)

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  # 국토교통부 법정동코드 CSV를 넣는 곳
  codes_dir: data/raw/codes
  chroma_dir: chroma_db

fss:
  base_url: https://finlife.fss.or.kr/finlifeapi
  # 수집할 상품 유형. 예적금도 받으려면 deposit, saving 을 추가한다.
  #   mortgage 주택담보대출, rent_house 전세자금대출, credit 개인신용대출
  #   deposit 정기예금, saving 적금
  product_types: ["mortgage", "rent_house", "credit"]
  # 권역 코드: 020000 은행, 030200 여신전문, 030300 저축은행, 050000 보험, 060000 금융투자
  fin_groups: ["020000", "030200", "030300", "050000"]
  request_interval_sec: 0.5
  max_retries: 3
  timeout_sec: 10

molit:
  # 국토교통부 아파트 매매 실거래가 (공공데이터포털, XML). 화면의 집 불빛(거래 사례)용이며 RAG 색인 대상이 아니다.
  base_url: https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade
  # 수집할 서울 구. 지역코드(LAWD_CD)는 법정동코드 CSV(data/raw/codes/)에서 찾는다.
  districts: [강남구, 마포구, 노원구, 관악구]
  # 야경 화면에서 구를 놓을 방향 (임시 배치, 화면 구성에 맞게 바꿔도 된다)
  directions:
    중심: [종로구, 중구, 용산구]
    북: [은평구, 강북구, 도봉구, 노원구, 성북구]
    동: [동대문구, 중랑구, 성동구, 광진구, 강동구, 송파구]
    서: [서대문구, 마포구, 강서구, 양천구, 구로구, 영등포구]
    남: [강남구, 서초구, 관악구, 동작구, 금천구]
  months: 6
  # 마지막 계약년월(YYYYMM). 비우면 지난달까지 받는다. (이번 달은 신고 기한 30일 때문에 덜 채워져 있음)
  end_month:
  num_of_rows: 1000
  request_interval_sec: 0.3
  max_retries: 3
  timeout_sec: 15

wiki:
  api_url: https://ko.wikipedia.org/w/api.php
  request_interval_sec: 1.0
  max_retries: 3
  timeout_sec: 10
  max_queries: 4          # 프롬프트1 검색어 수 (상품 대출 유형 포함)
  search_limit: 10        # 검색어당 전문 검색 후보 수 (제목 일치 문서는 따로 1개)
  max_docs_per_query: 2   # 프롬프트2가 고를 최대 문서 수
  min_chars: 200          # 이보다 짧은 본문은 버림
  cache_file: data/processed/wiki_cache.json

# 외부 문서 파일 (data/raw/docs/ 에 받은 이름 그대로 둔다)
docs:
  dir: data/raw/docs
  glossaries:
    - key: hf
      doc_type: glossary_hf
      name: 한국주택금융공사 단어사전
      url: https://www.data.go.kr/data/15160532/fileData.do
      pattern: "*주택금융공사*단어사전*.csv"
      columns: {id: 단어아이디, term: 단어명, en: 단어영문명, desc: 단어설명}
    - key: epost
      doc_type: glossary_epost
      name: 우체국예금보험 금융용어사전
      url: https://www.data.go.kr/data/15163200/fileData.do
      pattern: "*우체국예금보험*금융용어사전*.csv"
      columns: {id: 금융용어번호, term: 한글제목, en: 영문제목, desc: 금융용어사전내용}
    - key: epostbot
      doc_type: glossary_epost_chatbot
      name: 우체국 고객센터 챗봇 금융용어 사전
      url: https://www.data.go.kr/data/15163690/fileData.do
      pattern: "*챗봇*금융용어*.csv"
      columns: {term: 용어, desc: 설명}
  pdfs:
    - key: bok800
      doc_type: glossary_bok
      name: 한국은행 경제금융용어 800선
      url: https://www.bok.or.kr/portal/bbs/B0000249/view.do?menuNo=200765&nttId=10096081
      pattern: "*800*.pdf"
      skip_pages: 0

llm:
  chat_model: gpt-4.1-mini
  embedding_model: text-embedding-3-small
  temperature: 0

vectorstore:
  meta_collection: loan_meta
  doc_collection: loan_docs

chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  top_k: 5
  # similarity | mmr (F2014)
  search_type: similarity
  mmr_fetch_k: 20
  mmr_lambda: 0.5
